[project]
name = "epistemic-workbench"
version = "2026.9.16"
description = "Argument-graph analyzer/editor over the living library; unified Episteme MCP server; web app"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.40",
  "anyio>=4",
  "click>=8",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "mcp>=1.2",
  "pydantic>=2",
  "rich>=13",
  "pyyaml>=6",
  "claude-agent-sdk",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
